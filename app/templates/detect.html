<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skin Disease Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            color: #ffffff;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(146, 106, 212, 0.5);
            max-width: 600px;
            margin: 60px auto;
            text-align: center;
        }

        h1 {
            color: #926ad4;
            font-size: 28px;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group {
            width: 100%;
            text-align: left;
            margin: 15px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #ccc;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #2e2e2e;
            color: #fff;
            font-size: 14px;
            transition: background 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            background-color: #3a3a3a;
        }

        .file-upload-wrapper {
            width: 100%;
            margin-top: 20px;
        }

        .file-upload-label {
            background-color: #926ad4;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            text-align: center;
            transition: background-color 0.3s;
        }

        .file-upload-label:hover {
            background-color: #a987e6;
        }

        input[type="file"] {
            display: none;
        }

        .btn-submit {
            margin-top: 30px;
            background-color: #926ad4;
            color: #000;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #a987e6;
        }

        .result {
            margin-top: 30px;
        }

        .result h2 {
            color: #926ad4;
            font-weight: 600;
        }

        .result img {
            margin-top: 15px;
            max-width: 80%;
            border-radius: 12px;
            box-shadow: 0 6px 30px rgba(146, 106, 212, 0.5);
        }

        a {
            margin-top: 30px;
            display: inline-block;
            color: #926ad4;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .credit {
            text-align: center;
            font-size: 13px;
            margin-top: 50px;
            color: #aaa;
        }

        /* Optional loading animation
        .loader {
            border: 6px solid #2e2e2e;
            border-top: 6px solid #926ad4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        */
    </style>
</head>
<body>

<div class="container">
    <h1>Skin Disease Detection</h1>

    <form method="POST" enctype="multipart/form-data">
        <!-- Gender -->
        <div class="input-group">
            <label for="gender">Gender:</label>
            <select name="gender" id="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Age -->
        <div class="input-group">
            <label for="age">Age:</label>
            <input type="number" name="age" id="age" min="0" required>
        </div>

        <!-- Days Suffering -->
        <div class="input-group">
            <label for="days">Number of Days Suffering:</label>
            <input type="number" name="days" id="days" min="1" required>
        </div>

        <!-- File Upload -->
        <div class="file-upload-wrapper">
            <label class="file-upload-label">
                Choose Image
                <input type="file" name="file" id="file" required>
            </label>
        </div>

        <!-- Submit Button -->
        <button class="btn-submit" type="submit">Predict</button>
    </form>

    {% if res %}
    <div class="result">
        <h2>Predicted Disease: {{ res }}</h2>
    </div>
    {% endif %}

    <a href="/">← Back to Home</a>
</div>

<div class="credit">Created by <strong>Dev & Akankshya</strong> | All rights reserved</div>

</body>
</html>
