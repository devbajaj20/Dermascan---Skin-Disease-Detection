<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column; /* Stack items vertically */
            align-items: center; /* Center horizontally */
            min-height: 100vh; /* Ensure body takes full viewport height */
            margin: 0;
            padding-bottom: 40px; /* Add padding for the fixed footer */
            box-sizing: border-box; /* Include padding in total height */
            position: relative; /* For positioning the fixed footer */
        }

        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px; /* Space between header and form */
            font-size: 3em;
            font-weight: bold;
            color: #4a6d89; /* Example color for Dermacare */
        }

        .form-container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            width: 300px;
            margin-bottom: 40px; /* Space between form and footer */
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #2c2c2c;
            color: #fff;
            border: none;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .error {
            color: #ff4c4c;
            text-align: center;
            margin-bottom: 10px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            background-color: #1e1e1e;
            color: #777;
            text-align: center;
            padding: 10px 0;
            font-size: 0.8em;
            position: fixed; /* Stick the footer to the bottom */
            bottom: 0;
            left: 0;
            width: 100%;
        }

        .footer .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer .credit {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="header">Dermascan</div>
    <div class="form-container">
        <h2>Login</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <a href="/register">Don't have an account? Register</a>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="credit"> Created by <span>Dev & Akankshya</span> | All rights reserved </div>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
